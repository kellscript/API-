<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha API no GitHub</title>
</head>
<body>

    <h1>Conteúdo da API</h1>
    <pre id="api-data">Carregando...</pre>

    <script>
        fetch('https://kellscript.github.io/API-/Opa.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Erro na rede: ' + response.status);
                }
                return response.json();
            })
            .then(data => {
                // Exibe o JSON formatado na tela
                document.getElementById('api-data').innerText = JSON.stringify(data, null, 2);
            })
            .catch(error => {
                console.error('Erro:', error);
                document.getElementById('api-data').innerText = 'Erro ao carregar os dados.';
            });
    </script>

</body>
</html>
